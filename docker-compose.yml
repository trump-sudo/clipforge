x-php: &php
  build:
    context: .
    dockerfile: docker/php/Dockerfile
  image: clipforge-php
  pull_policy: build   # local image: build it, never try to pull from Docker Hub

services:
  app:
    <<: *php
    environment:
      ROLE: app
    volumes:
      - .:/var/www/html
      - vendor:/var/www/html/vendor
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started

  worker:
    <<: *php
    environment:
      ROLE: worker
    user: www-data
    command: php artisan queue:work redis --queue=media,default --tries=2 --timeout=600 --sleep=1
    volumes:
      - .:/var/www/html
      - vendor:/var/www/html/vendor
    depends_on: [app]
    restart: unless-stopped

  scheduler:
    <<: *php
    environment:
      ROLE: scheduler
    user: www-data
    command: php artisan schedule:work
    volumes:
      - .:/var/www/html
      - vendor:/var/www/html/vendor
    depends_on: [app]
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [app]

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: clipforge
      MYSQL_USER: clipforge
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data

volumes:
  vendor:   # vendor/ in a Docker volume: fast and reliable on Windows/macOS bind mounts
  mysql-data:
  redis-data: